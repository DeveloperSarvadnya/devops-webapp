name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify web application
        run: |
          echo "Starting CI verification..."
          test -f index.html
          echo "index.html exists successfully."
          echo "CI verification completed successfully."

      - name: Slack notification - Success
        if: success()
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"✅ CI Pipeline SUCCESS for devops-webapp. Commit: ${{ github.sha }}"}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Slack notification - Failure
        if: failure()
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"❌ CI Pipeline FAILED for devops-webapp. Commit: ${{ github.sha }}"}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"